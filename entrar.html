<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egglish - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (solo para botones de tema y cerrar) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: 'class' };
    </script>
    <script>
      if (localStorage.getItem('egglish-theme') === 'dark' ||
          (!localStorage.getItem('egglish-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    </script>

    <style>
        :root {
            --blue: #1cb0f6;
            --blue-shadow: #0090d9;
            --green: #58cc02;
            --green-shadow: #46a302;
            --bg-color: #f0f4f8;
            --border-color: #e5e7eb;
            --text-color: #4b4b4b;
            --input-bg: #f7f9fa;
            --focus-border: #84d8ff;
            --card-bg: rgba(255, 255, 255, 0.16);
            --card-border: rgba(255, 255, 255, 0.35);
        }

        html.dark {
            --bg-color: #0b172a;
            --border-color: #334155;
            --text-color: #f1f5f9;
            --input-bg: #0f172a;
            --card-bg: rgba(15, 23, 42, 0.22);
            --card-border: rgba(148, 163, 184, 0.25);
        }

        html.dark .login-card { background-color: var(--card-bg); }
        html.dark .input-group input { background-color: #0f172a; color: #f1f5f9; }
        html.dark .input-group input::placeholder { color: #94a3b8; }
        html.dark .modal-content { background-color: var(--card-bg); }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
            position: relative;
            overflow-x: hidden;
        }

        /* =====================================================
           FONDO — degradado LINEAL en movimiento (en vez de
           blobs circulares). Usa solo tonos de azul y se anima
           desplazando la posición del degradado para dar
           sensación de fondo "vivo".
           ===================================================== */
        #page-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            background: linear-gradient(120deg,
                #eaf6ff, #bfe8ff, #7ec8ff, #1cb0f6, #4c9cff, #bfe8ff, #eaf6ff);
            background-size: 400% 400%;
            animation: gradient-move 18s ease infinite;
        }
        html.dark #page-bg {
            background: linear-gradient(120deg,
                #0b172a, #172554, #0c4a8f, #0090d9, #1cb0f6, #172554, #0b172a);
            background-size: 400% 400%;
        }
        @keyframes gradient-move {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @media (prefers-reduced-motion: reduce) {
            #page-bg { animation: none; }
        }

        /* Tarjetas de vidrio: fondo semitransparente + blur real
           (backdrop-filter), igual que .backdrop-blur-sm/md de
           Tailwind usado en las secciones de index.html */
        .login-card,
        .modal-content {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        /* Tarjeta Principal */
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* =====================================================
           EFECTO BEAM PLATEADO — misma técnica que el borde
           giratorio de las tarjetas "¿Por qué elegir Egglish?"
           en index.html, pero con tonos plateados/metálicos en
           vez de azul/índigo, aplicado a la caja del formulario.
           ===================================================== */
        @property --beam {
            syntax: '<angle>';
            inherits: false;
            initial-value: 0deg;
        }
        @keyframes beam-spin { to { --beam: 360deg; } }

        .login-card {
            position: relative;
            isolation: isolate;
            background-color: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.05);
        }
        .login-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 2px;
            background: conic-gradient(from var(--beam), transparent 0 70%, #f8fafc 85%, #94a3b8 100%);
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: beam-spin 4s linear infinite;
            pointer-events: none;
            z-index: -1;
        }

        .card-header {
            margin-bottom: 25px;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* Marco del logo: mismo tratamiento "icono con marco
           blanco + blur" que los íconos de "Tu camino hacia la
           fluidez" en index.html (bg-white/60 + backdrop-blur +
           rounded + borde de color) */
        .logo-frame {
            width: 88px;
            height: 88px;
            border-radius: 24px;
            background-color: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 3px solid #bfe8ff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        html.dark .logo-frame {
            background-color: rgba(15, 23, 42, 0.6);
            border-color: #1e3a5f;
        }

        .logo {
            width: 64px;
            height: 64px;
            object-fit: contain;
        }

        h1 {
            font-size: 24px;
            font-weight: 900;
            color: var(--text-color);
        }

        /* Formularios y Entradas */
        .login-form, .recovery-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-group {
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            background-color: var(--input-bg);
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
            color: var(--text-color);
        }

        .input-group.password-field-wrapper input {
            padding-right: 52px;
        }

        .input-group input:focus {
            border-color: var(--focus-border);
            background-color: white;
        }

        .input-group input::placeholder {
            color: #afafaf;
            font-weight: 700;
        }

        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            color: #6b7280;
            transition: background-color 0.2s ease, transform 0.15s ease;
        }

        .password-toggle:hover {
            background-color: #f3f4f6;
        }

        .password-toggle:active {
            transform: translateY(-50%) scale(0.92);
        }

        .password-toggle svg {
            width: 20px;
            height: 20px;
            display: block;
        }

        .forgot-password {
            color: #000000;
            text-decoration: none;
            font-weight: 800;
            font-size: 14px;
            text-align: left;
        }
        html.dark .forgot-password {
            color: #ffffff;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        /* Botones "Fat" */
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            color: white;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn-primary {
            background-color: var(--blue);
            box-shadow: 0 4px 0 var(--blue-shadow);
            margin-top: 8px;
            padding: 18px;
            font-size: 17px;
        }

        .btn-primary:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 var(--blue-shadow);
        }

        /* =====================================================
           EFECTOS DEL BOTÓN "Empezar a Jugar" DE index.html
           1) hover-circle-btn: círculo que "nace" desde el punto
              exacto donde entra el cursor.
           2) click-effect: ripple blanco que se expande al hacer
              click (efecto "effect_dylan").
           ===================================================== */
        .hover-circle-btn {
            position: relative;
            overflow: hidden;
            isolation: isolate;
        }
        .hover-circle-btn .btn-label {
            position: relative;
            z-index: 2;
            transition: color 0.3s ease-in-out;
        }
        .hover-circle-btn .hover-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            display: block;
            width: 0;
            height: 0;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.4s ease-in-out, height 0.4s ease-in-out;
            pointer-events: none;
            z-index: 1;
        }
        .hover-circle-btn:hover .hover-circle {
            width: 250%;
            height: 250%;
        }

        .click-effect {
            position: relative;
            overflow: hidden;
        }
        .click-effect:before {
            content: '';
            position: absolute;
            inset: 0;
            display: block;
            border-radius: inherit;
            background-color: rgba(255, 255, 255, 0.55);
            transform: scale(0.001, 0.001);
            pointer-events: none;
            z-index: 3;
        }
        .click-effect.is-clicked:before {
            animation: click-ripple 0.7s ease-out;
        }
        @keyframes click-ripple {
            50%  { transform: scale(1.4, 1.4); opacity: 0; }
            99%  { transform: scale(0.001, 0.001); opacity: 0; }
            100% { transform: scale(0.001, 0.001); opacity: 0.55; }
        }

        .btn-secondary {
            background-color: var(--green);
            box-shadow: 0 4px 0 var(--green-shadow);
            margin-top: 5px;
        }

        .btn-secondary:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 var(--green-shadow);
        }

        /* Ventana Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.hidden {
            display: none;
        }

        .modal-content {
            background-color: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 350px;
            position: relative;
            text-align: center;
            box-shadow: 0 8px 0 rgba(0,0,0,0.05);
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            width: auto;
            padding: 0;
            background: none;
            box-shadow: none;
            color: #afafaf;
            font-size: 24px;
            font-weight: bold;
            text-transform: none;
            margin: 0;
        }

        .close-btn:hover {
            color: var(--text-color);
        }

        .close-btn:active {
            transform: none;
        }

        .modal-content h2 {
            margin-bottom: 10px;
            font-size: 20px;
        }

        .modal-content p {
            margin-bottom: 20px;
            color: #777;
            font-weight: 700;
            font-size: 15px;
        }

        .success-message {
            color: var(--green) !important;
            margin-top: 15px;
            margin-bottom: 0 !important;
            font-weight: 800 !important;
        }

        .success-message.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <!--
      ============================================================
      FONDO — mismas olas SVG que el hero de index.html, aplicadas
      con blur permanente (filter: blur) para lograr el mismo
      efecto de "fondo borroso" detrás de la tarjeta de login.
      ============================================================
    -->
    <div id="page-bg" aria-hidden="true"></div>

    <a href="/index.html" aria-label="Cerrar y volver al inicio"
       class="fixed top-4 left-4 z-50 w-10 h-10 flex items-center justify-center rounded-full bg-white/70 dark:bg-slate-800/70 backdrop-blur-md border-2 border-white/60 dark:border-slate-700/60 text-gray-700 dark:text-white text-xl font-bold hover:bg-white dark:hover:bg-slate-700 no-underline shadow-sm">
      &times;
    </a>

    <button id="dark-mode-toggle" type="button" aria-label="Cambiar modo oscuro" aria-pressed="false"
       class="fixed top-4 right-4 z-50 w-10 h-10 flex items-center justify-center rounded-full bg-white/70 dark:bg-slate-800/70 backdrop-blur-md border-2 border-white/60 dark:border-slate-700/60 hover:bg-white dark:hover:bg-slate-700 shadow-sm">
      <svg id="dark-mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 text-gray-700 dark:text-white">
        <path id="icon-moon" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>
        <g id="icon-sun" class="hidden">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
        </g>
      </svg>
    </button>

    <main class="login-container">
        <div class="login-card">
            <header class="card-header">
                <div class="logo-container">
                    <div class="logo-frame">
                        <img src="/imgs/eggy.png" alt="Egglish" class="logo">
                    </div>
                    <h1>Inicia Sesión</h1>
                </div>
            </header>
            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <input type="email" id="email" placeholder="Correo electrónico" required>
                </div>
                <div class="input-group password-field-wrapper">
                    <input type="password" id="password" placeholder="Contraseña" required>
                    <button type="button" class="password-toggle" id="password-toggle" aria-label="Mostrar contraseña">
                        <svg viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
                <a href="#" id="forgotPasswordBtn" class="forgot-password">¿Olvidaste tu contraseña?</a>
                <button type="submit" class="btn-primary hover-circle-btn click-effect">
                    <span class="hover-circle" style="background-color:#0090d9"></span>
                    <span class="btn-label">INGRESAR</span>
                </button>
            </form>
        </div>
    </main>

    <!-- Modal de Recuperación -->
    <div id="recoveryModal" class="modal hidden">
        <div class="modal-content">
            <button id="closeModalBtn" class="close-btn" type="button">&times;</button>
            <h2>Recuperar cuenta</h2>
            <p>Ingresa tu correo para recuperar tu cuenta</p>
            <form id="recoveryForm" class="recovery-form">
                <div class="input-group">
                    <input type="email" id="recoveryEmail" placeholder="Correo electrónico" required>
                </div>
                <button type="submit" class="btn-secondary">ENVIAR CORREO</button>
                <p id="successMessage" class="success-message hidden">Correo enviado con éxito</p>
            </form>
        </div>
    </div>

    <script type="module">
        // ── Firebase CDN ──────────────────────────────────────
        import { firebaseConfig } from '/Secciones/Js/firebase-config.js';

        const FB_CDN = 'https://www.gstatic.com/firebasejs/10.12.2';

        const { initializeApp, getApps }                              = await import(`${FB_CDN}/firebase-app.js`);
        const { getAuth, sendPasswordResetEmail }                     = await import(`${FB_CDN}/firebase-auth.js`);
        const { getFirestore, collection, query, where, getDocs }     = await import(`${FB_CDN}/firebase-firestore.js`);

        const app  = getApps().length === 0 ? initializeApp(firebaseConfig) : getApps()[0];
        const auth = getAuth(app);
        const db   = getFirestore(app);

        // ── Referencias DOM ───────────────────────────────────
        const forgotPasswordBtn = document.getElementById('forgotPasswordBtn');
        const recoveryModal     = document.getElementById('recoveryModal');
        const closeModalBtn     = document.getElementById('closeModalBtn');
        const recoveryForm      = document.getElementById('recoveryForm');
        const successMessage    = document.getElementById('successMessage');
        const recoveryEmailIn   = document.getElementById('recoveryEmail');
        const sendBtn           = recoveryForm.querySelector('button[type="submit"]');

        // ── Mensaje de error debajo del input ─────────────────
        const errorMsg = document.createElement('p');
        errorMsg.style.cssText = `
            color: #ef4444; font-weight: 800; font-size: 14px;
            margin: 4px 0 0 0; display: none; font-family: 'Nunito', sans-serif;
        `;
        recoveryEmailIn.parentNode.insertAdjacentElement('afterend', errorMsg);

        // ── Validación de formato en tiempo real ──────────────
        const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[a-zA-Z]{2,}$/;

        sendBtn.disabled = true;
        sendBtn.style.opacity = '0.6';

        recoveryEmailIn.addEventListener('input', () => {
            errorMsg.style.display = 'none';
            recoveryEmailIn.style.borderColor = '';
            const val = recoveryEmailIn.value.trim();
            const formatOk = EMAIL_RE.test(val);
            sendBtn.disabled = !formatOk;
            sendBtn.style.opacity = formatOk ? '1' : '0.6';
        });

        // ── Abrir / cerrar modal ──────────────────────────────
        forgotPasswordBtn.addEventListener('click', (e) => {
            e.preventDefault();
            recoveryModal.classList.remove('hidden');
        });
        closeModalBtn.addEventListener('click', closeModal);
        recoveryModal.addEventListener('click', (e) => {
            if (e.target === recoveryModal) closeModal();
        });

        // ── Buscar email en Firestore (colección "users") ─────
        // Esta es la única forma confiable: Firebase Auth no expone
        // si un email existe desde el cliente en versiones modernas.
        // Firestore sí lo sabe porque auth.js guarda { name, email, age }
        // al registrar. Los usuarios viejos sin campo email deben
        // agregarlo manualmente en la consola de Firebase.
        async function emailExisteEnFirestore(email) {
            const q        = query(collection(db, 'users'), where('email', '==', email));
            const snapshot = await getDocs(q);
            return !snapshot.empty;
        }

        // ── Enviar correo de recuperación ─────────────────────
        recoveryForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = recoveryEmailIn.value.trim();
            if (!email) { showError('Ingresa tu correo electrónico.'); return; }

            sendBtn.disabled    = true;
            sendBtn.textContent = 'VERIFICANDO...';
            sendBtn.style.opacity = '0.7';
            errorMsg.style.display = 'none';
            successMessage.classList.add('hidden');

            try {
                // ── 1. Comprobar en Firestore si el email existe ────────
                const existe = await emailExisteEnFirestore(email);

                if (!existe) {
                    // ❌ No hay usuario con ese correo → no enviar nada
                    sendBtn.disabled    = false;
                    sendBtn.textContent = 'ENVIAR CORREO';
                    sendBtn.style.opacity = '1';
                    showError('Este correo no posee un usuario asociado.');
                    recoveryEmailIn.style.borderColor = '#ef4444';
                    return;
                }

                // ── 2. Sí existe en Firestore → enviar correo ──────────
                sendBtn.textContent   = 'ENVIANDO...';
                await sendPasswordResetEmail(auth, email);

                // ✅ Éxito — el modal queda abierto, el usuario lo cierra
                successMessage.textContent = '✅ Correo enviado. Revisa tu bandeja de entrada y también la carpeta de spam.';
                successMessage.classList.remove('hidden');
                sendBtn.textContent      = 'ENVIADO ✓';
                sendBtn.style.background = '#58cc02';
                sendBtn.style.boxShadow  = '0 4px 0 #46a302';
                sendBtn.style.opacity    = '1';
                sendBtn.disabled         = true; // evitar doble envío

            } catch (err) {
                sendBtn.disabled    = false;
                sendBtn.textContent = 'ENVIAR CORREO';
                sendBtn.style.opacity = '1';
                showError(getResetError(err.code));
            }
        });

        // ── Helpers ───────────────────────────────────────────
        function showError(msg) {
            errorMsg.textContent   = msg;
            errorMsg.style.display = 'block';
        }

        function closeModal() {
            recoveryModal.classList.add('hidden');
            recoveryForm.reset();
            successMessage.classList.add('hidden');
            errorMsg.style.display = 'none';
            recoveryEmailIn.style.borderColor = '';
            sendBtn.disabled    = true;
            sendBtn.textContent = 'ENVIAR CORREO';
            sendBtn.style.opacity    = '0.6';
            sendBtn.style.background = '';
            sendBtn.style.boxShadow  = '';
        }

        function getResetError(code) {
            const map = {
                'auth/invalid-email':          'El correo no es válido.',
                'auth/too-many-requests':      'Demasiados intentos. Espera unos minutos.',
                'auth/network-request-failed': 'Sin conexión. Revisa tu internet.',
                'auth/missing-email':          'Ingresa tu correo electrónico.',
            };
            return map[code] || 'Error al enviar el correo. Intenta de nuevo.';
        }
    </script>
    <script>
      (function () {
        document.querySelectorAll('.hover-circle-btn').forEach(function (btn) {
          var circle = btn.querySelector('.hover-circle');
          if (!circle) return;
          function moveCircle(e) {
            var rect = btn.getBoundingClientRect();
            circle.style.top = (e.clientX ? e.clientY - rect.top : rect.height / 2) + 'px';
            circle.style.left = (e.clientX ? e.clientX - rect.left : rect.width / 2) + 'px';
          }
          btn.addEventListener('mouseenter', moveCircle);
          btn.addEventListener('mouseout', moveCircle);
        });

        document.querySelectorAll('.click-effect').forEach(function (btn) {
          btn.addEventListener('click', function () {
            btn.classList.remove('is-clicked');
            void btn.offsetWidth; // fuerza reflow para reiniciar la animación
            btn.classList.add('is-clicked');
          });
          btn.addEventListener('animationend', function () {
            btn.classList.remove('is-clicked');
          });
        });
      })();
    </script>
    <script>
      (function () {
        const root = document.documentElement;
        const darkToggle = document.getElementById('dark-mode-toggle');
        function syncDarkModeUI() {
          const isDark = root.classList.contains('dark');
          document.getElementById('icon-moon').classList.toggle('hidden', isDark);
          document.getElementById('icon-sun').classList.toggle('hidden', !isDark);
          darkToggle.setAttribute('aria-pressed', String(isDark));
        }
        darkToggle.addEventListener('click', () => {
          root.classList.toggle('dark');
          localStorage.setItem('egglish-theme', root.classList.contains('dark') ? 'dark' : 'light');
          syncDarkModeUI();
        });
        syncDarkModeUI();
