<!DOCTYPE html>

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <script>
/* ════════════════════════════════════════════════

const QUESTIONS = [

  { q: '19) I could hear the neighbors ...... last night.',

const LEVELS = [
  { min: 0,  max: 14,  code: 'A1', name: 'Principiante',        desc: 'Conoces palabras básicas y frases muy simples. Estás dando tus primeros pasos en inglés. ¡Es el mejor momento para empezar!' },
  { min: 15, max: 28,  code: 'A2', name: 'Básico',              desc: 'Puedes comunicarte en situaciones simples del día a día. Tienes una base sólida para crecer rápido.' },
  { min: 29, max: 44,  code: 'B1', name: 'Intermedio',          desc: 'Manejas temas cotidianos y puedes expresar opiniones básicas. ¡Vas muy bien encaminado!' },
  { min: 45, max: 58,  code: 'B2', name: 'Intermedio-Avanzado', desc: 'Comprendes ideas complejas y te expresas con fluidez en la mayoría de situaciones. ¡Excelente nivel!' }
];

const LETTERS = ['A','B','C','D'];

let current = 0;
let score   = 0;
let answers = new Array(QUESTIONS.length).fill(null);

const host        = document.getElementById('screen-host');
const progressWrap= document.getElementById('progress-wrap');
const progFill    = document.getElementById('prog-fill');
const progLabel   = document.getElementById('prog-label');
const progPct     = document.getElementById('prog-pct');

/* ── Utilidades ── */
function setProgress(idx) {
  const pct = Math.round((idx / QUESTIONS.length) * 100);
  progFill.style.width = pct + '%';
  progLabel.textContent = 'Pregunta ' + (idx + 1) + ' de ' + QUESTIONS.length;
  progPct.textContent = pct + '%';
}

/* Mueve el círculo de ripple desde la posición del cursor */
function attachRipple(btn, circleClass) {
  btn.addEventListener('mouseenter', function(e) {
    const r = btn.getBoundingClientRect();
    const c = btn.querySelector('.' + circleClass);
    if (c) { c.style.top = (e.clientY - r.top) + 'px'; c.style.left = (e.clientX - r.left) + 'px'; }
  });
  btn.addEventListener('mouseout', function(e) {
    const r = btn.getBoundingClientRect();
    const c = btn.querySelector('.' + circleClass);
    if (c) { c.style.top = (e.clientY - r.top) + 'px'; c.style.left = (e.clientX - r.left) + 'px'; }
  });
}

/* ════════════════════════════════════════════════
   PANTALLA BIENVENIDA
════════════════════════════════════════════════ */
function showWelcome() {
  progressWrap.style.display = 'none';
  host.innerHTML = `
    <div class="card screen">
      <div class="welcome-chick"><div class="chick-bounce"><img src="/imgs/eggy.png" alt="Pollito Egglish"/></div></div>
      <p class="welcome-title">¿Cuál es tu nivel de inglés?</p>
      <p class="welcome-sub">Responde 25 preguntas y te diremos exactamente en qué punto estás para aprendas justo desde ahí.</p>
      <button class="btn-primary btn-green" id="btn-start" onclick="startTest()">
        <span class="btn-ripple" style="background:rgba(70,163,2,0.35)"></span>
        <span class="btn-label">¡Hacer el test de nivel!</span>
      </button>
      <div class="or-divider">o</div>

  attachRipple(document.getElementById('btn-start'), 'btn-ripple');

/* ════════════════════════════════════════════════
   OMITIR TEST
════════════════════════════════════════════════ */
function skipTest() {
  progressWrap.style.display = 'none';
  host.innerHTML = `
    <div class="card screen" style="text-align:center">
      <div class="welcome-chick"><div class="chick-bounce"><img src="/imgs/eggy.png" alt="Pollito"/></div></div>

      <p class="welcome-sub" style="margin-bottom:26px">Empezarás desde el nivel A1 con lecciones súper básicas. ¡Tu pollito te va a guiar!</p>
      <button class="btn-primary btn-green" id="btn-skip-go" onclick="goToProfile('A1')">
        <span class="btn-ripple" style="background:rgba(70,163,2,0.35)"></span>
        <span class="btn-label">¡Vamos a empezar!</span>
      </button>

  attachRipple(document.getElementById('btn-skip-go'), 'btn-ripple');
}

/* ════════════════════════════════════════════════
   INICIAR TEST
════════════════════════════════════════════════ */
function startTest() {
  current = 0; score = 0;
  answers = new Array(QUESTIONS.length).fill(null);
  progressWrap.style.display = 'block';
  showQuestion(0);
}

/* ════════════════════════════════════════════════
   MOSTRAR PREGUNTA
════════════════════════════════════════════════ */
function showQuestion(idx) {
  setProgress(idx);
  const q = QUESTIONS[idx];
  const sectionHtml = q.section ? `<p class="section-instruction">${q.section}</p>` : '';
  const isLast = idx === QUESTIONS.length - 1;
  const hasAnswer = answers[idx] !== null;

  const optsHtml = q.opts.map((o, i) => `
    <button class="opt-btn${answers[idx] === i ? ' selected' : ''}" data-idx="${i}" id="opt-${i}">
      <span class="opt-ripple"></span>
      <span class="opt-letter">${LETTERS[i]}</span>
      <span class="opt-text">${o}</span>
    </button>`).join('');

  host.innerHTML = `
    <div class="card screen">
      ${sectionHtml}
      <span class="question-num">Pregunta ${idx + 1} / ${QUESTIONS.length}</span>
      <p class="question-text">${q.q}</p>
      <div class="options-list">${optsHtml}</div>
      <button class="btn-next${hasAnswer ? ' ready' : ''}" id="next-btn">
        <span class="btn-ripple"></span>
        <span class="btn-label">${isLast ? 'Ver mi resultado' : 'Siguiente'}</span>
      </button>
    </div>`;

  /* Vincular eventos */
  document.querySelectorAll('.opt-btn').forEach(btn => {
    /* Ripple circular de hover desde cursor */
    btn.addEventListener('mouseenter', function(e) {
      const r = btn.getBoundingClientRect();
      const c = btn.querySelector('.opt-ripple');
      c.style.top  = (e.clientY - r.top)  + 'px';
      c.style.left = (e.clientX - r.left) + 'px';
    });
    btn.addEventListener('mouseout', function(e) {
      const r = btn.getBoundingClientRect();
      const c = btn.querySelector('.opt-ripple');
      c.style.top  = (e.clientY - r.top)  + 'px';
      c.style.left = (e.clientX - r.left) + 'px';
    });
    /* Click */
    btn.addEventListener('click', function() {
      /* efecto ripple de click */
      btn.classList.remove('is-clicked');
      void btn.offsetWidth;
      btn.classList.add('is-clicked');
      btn.addEventListener('animationend', () => btn.classList.remove('is-clicked'), { once: true });
      selectAnswer(parseInt(btn.dataset.idx));
    });
  });

  /* Botón siguiente */
  const nextBtn = document.getElementById('next-btn');
  attachRipple(nextBtn, 'btn-ripple');
  nextBtn.addEventListener('click', function() {
    if (!nextBtn.classList.contains('ready')) return;
    isLast ? finishTest() : nextQuestion();
  });
}

/* ════════════════════════════════════════════════
   SELECCIONAR RESPUESTA
════════════════════════════════════════════════ */
function selectAnswer(i) {
  answers[current] = i;
  document.querySelectorAll('.opt-btn').forEach((b, j) => b.classList.toggle('selected', j === i));
  /* Activar botón siguiente con transición a verde */
  const nextBtn = document.getElementById('next-btn');
  if (nextBtn) nextBtn.classList.add('ready');
}

/* ════════════════════════════════════════════════
   SIGUIENTE / FINALIZAR
════════════════════════════════════════════════ */
function nextQuestion() {
  if (answers[current] === null) return;
  current++;
  showQuestion(current);
}

function finishTest() {
  score = 0;
  QUESTIONS.forEach((q, i) => { if (answers[i] === q.correct) score += q.score; });
  const maxScore = QUESTIONS.reduce((a, q) => a + q.score, 0);
  const pct = Math.round((score / maxScore) * 100);
  const level = LEVELS.find(l => score >= l.min && score <= l.max) || LEVELS[LEVELS.length - 1];
  progressWrap.style.display = 'none';
  const correct = answers.filter((a, i) => a === QUESTIONS[i].correct).length;
  showRecommendation(level.code, correct);
}

/* ════════════════════════════════════════════════
   GUARDAR NIVEL EN FIRESTORE Y REDIRIGIR
════════════════════════════════════════════════ */
async function goToProfile(levelCode) {
  /* 1. Guardar en localStorage como caché rápida */
  localStorage.setItem('egglish-level', levelCode);

  /* 2. Actualizar Firestore: nivel + marcar usuario como no-nuevo */
  try {
    const { getFirestore, doc, updateDoc } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
    const { onAuthStateChanged } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');

    /* Reutilizar la misma instancia de auth/db que usa el resto del sitio,
       en vez de inicializar una app de Firebase nueva. */
    const { auth } = await import('/Secciones/Js/firebase-config.js');
    const db = getFirestore(auth.app);

    /* auth.currentUser puede seguir en null justo después de cargar la
       página, porque Firebase todavía está restaurando la sesión de forma
       asíncrona. Esperamos a onAuthStateChanged para tener la certeza. */
    const user = auth.currentUser || await new Promise((resolve) => {
      const unsub = onAuthStateChanged(auth, (u) => { unsub(); resolve(u); });
    });

    if (user) {
      await updateDoc(doc(db, 'users', user.uid), {
        isNewUser: false,
        level: levelCode,
      });
    } else {
      console.warn('[Egglish] goToProfile: no hay usuario autenticado, no se pudo actualizar isNewUser.');
    }
  } catch (e) {
    /* Si Firestore falla, igual redirigimos — el nivel está en localStorage */
    console.warn('[Egglish] No se pudo actualizar Firestore al salir del test:', e);
  }

  /* 3. Ir a lecciones */
  window.location.replace('/Secciones/lecciones.html');
}
